<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderia - Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../../pesquisa/styles.css">
    <link rel="stylesheet" href="../../styles.css">
</head>

<body>

    <header class="cabecalho-principal">
        <div class="logo-container">
                <h1>ELDERIA</h1>
            <a href="../../index.html">
                <img src="https://media.tenor.com/wGufiBV_pI0AAAAe/hide-the-pain-harold-pain.png" alt="Início" class="haroldo">
            </a>
        </div>
        <nav class="navegacao-botoes">
            <a href="../../perfil/index.html" class="btn-nav">Ver Meu Perfil</a>
            <a href="../Elderia/consulta/index.html" class="btn-nav">Consultas</a>
        </nav>
        <div class="usuario-info">
            <a href="../../conta/cadastro/cadastro.html" class="btn-sair">Crie sua Conta</a>
        </div>
    </header>

    <div class="corpologin">
        <div class="login-container">
            <div class="login-header">
                <h2>Acessar Elderia</h2>
                <p>Bem-vindo de volta!</p>
            </div>

            <div id="message">
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail ou CPF</label>
                    <input type="text" id="identificador" name="identificador"
                        placeholder="exemplo@email.com ou 000.000.000-00" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <div class="footer-links">
                Não tem uma conta? <a href="../../conta/cadastro/cadastro.html">Cadastre-se aqui</a>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>

</html>
