<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderia - Cadastro Completo</title>
    <link rel="stylesheet" href="../../pesquisa/styles.css">
    <link rel="stylesheet" href="editarperfil.css">
</head>
<body id="main-body">

    <header class="cabecalho-principal">
        <div class="logo-container">
            <a href="../../index.html">
                <h1>ELDERIA</h1>
                <img src="https://media.tenor.com/wGufiBV_pI0AAAAe/hide-the-pain-harold-pain.png" alt="Início" class="haroldo">
            </a>
        </div>
        <nav class="navegacao-botoes">
            <a href="../index.html" class="btn-nav">Voltar</a> 
        </nav>
    </header>
    
    <form id="form-editar" enctype="multipart/form-data">
    
        <fieldset>
            <legend>Dados Gerais</legend>

            <div class="form-group">
                <label>Nome</label>
                <input type="text" name="nome" id="nome">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" id="email">
            </div>

            <div class="form-group">
                <label>Telefone</label>
                <input type="text" name="telefone" id="telefone">
            </div>

            <div class="form-group">
                <label>CPF</label>
                <input type="text" name="cpf" id="cpf" readonly>
            </div>
        </fieldset>

        <div id="campos-idoso" style="display:none;">
            <fieldset>
                <legend>Informações do Idoso</legend>

                <div class="form-group">
                    <label>Data de nascimento</label>
                    <input type="date" name="data_nascimento" id="data_nascimento">
                </div>

                <div class="form-group">
                    <label>Alergias</label>
                    <textarea name="alergias" id="alergias"></textarea>
                </div>

                <div class="form-group">
                    <label>Informações de saúde</label>
                    <textarea name="informacoes_saude" id="informacoes_saude"></textarea>
                </div>

                <div class="form-group">
                    <label>Possui acessibilidade?</label>
                    <select name="possui_acessibilidade" id="possui_acessibilidade">
                        <option value="0">Não</option>
                        <option value="1">Sim</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Necessidades de acessibilidade</label>
                    <textarea name="necessidades_acessibilidade" id="necessidades_acessibilidade"></textarea>
                </div>
            </fieldset>
        </div>

        <div id="campos-profissional" style="display:none;">
            <fieldset>
                <legend>Informações do Profissional</legend>

                <div class="form-group">
                    <label>Registro profissional</label>
                    <input type="text" name="registro_profissional" id="registro_profissional">
                </div>

                <div class="form-group">
                    <label>Especialidade</label>
                    <input type="text" name="especialidade" id="especialidade">
                </div>

                <div class="form-group">
                    <label>Biografia</label>
                    <textarea name="biografia" id="biografia"></textarea>
                </div>

                <div class="form-group">
                    <label>Localização</label>
                    <input type="text" name="localizacao" id="localizacao">
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label>Data de emissão do Registro Profissional</label>
                    <input type="date" name="data_emissao" id="data_emissao">
                </div>

                <div class="form-group" id="container-cert-atual" style="display:none;">
                    <label>Documento de Identificação Atual:</label>
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                        <span id="nome-arquivo-atual" style="font-size: 0.9em; color: #555;"></span>
                        <button type="button" id="btn-remover-cert" class="btn-nav" style="background-color: #d9534f; padding: 5px 10px; color: white; border: none;">Remover</button>
                    </div>
                    <input type="hidden" name="manter_certificado" id="manter_certificado" value="1">
                </div>
                
                <div class="form-group" style="margin-bottom: 30px;">
                    <label>Atualizar Documento Principal (Opcional)</label>
                    <input type="file" name="url_documento" accept=".pdf,.jpg,.png">
                </div>

                <div id="lista-certificados-atuais" style="margin-top: 15px; margin-bottom: 20px;"></div>

                <div class="form-section-certificado">
                    <h3 class="certificado-title">
                        Adicionar Novo Certificado
                    </h3>
                    
                    <div class="form-group">
                        <label id="label_arquivo_certificado" class="certificado-label" for="url_documento_cert">Arquivo do Certificado (PDF)</label>
                        <input type="file" id="url_documento_cert" name="url_documento_cert" accept=".pdf" onchange="validarCamposCertificado()">
                    </div>

                    <div class="form-group">
                        <label id="label_titulo_certificado" class="certificado-label" for="titulo_certificado">Título da Especialização</label>
                        <input type="text" id="titulo_certificado" name="titulo_certificado" placeholder="Ex: Pós-Graduação em Geriatria" oninput="validarCamposCertificado()">
                    </div>

                    <div class="form-group">
                        <label id="label_data_emissao" class="certificado-label" for="data_emissao_cert">Data de Emissão</label>
                        <input type="date" id="data_emissao_cert" name="data_emissao_cert" onchange="validarCamposCertificado()">
                    </div>
                </div>

            </fieldset>
        </div>

        <button type="submit" class="btn-submit">
            Salvar Alterações
        </button>
    </form>

<script>
document.addEventListener("DOMContentLoaded", () => {
    fetch('get_dados_completo.php')
    .then(res => res.json())
    .then(res => {
        if(res.success){
            const d = res.dados;
            document.getElementById('nome').value = d.nome || '';
            document.getElementById('email').value = d.email || '';
            document.getElementById('telefone').value = d.telefone || '';
            document.getElementById('cpf').value = d.cpf || '';

            if(res.tipo === 'idoso'){
                document.getElementById('campos-idoso').style.display = 'block';
                document.getElementById('data_nascimento').value = d.data_nascimento || '';
                document.getElementById('alergias').value = d.alergias || '';
                document.getElementById('informacoes_saude').value = d.informacoes_saude || '';
                document.getElementById('possui_acessibilidade').value = d.possui_acessibilidade || 0;
                document.getElementById('necessidades_acessibilidade').value = d.necessidades_acessibilidade || '';
            }
            else if(res.tipo === 'profissional'){
                document.getElementById('campos-profissional').style.display = 'block';
                document.getElementById('registro_profissional').value = d.registro_profissional || '';
                document.getElementById('especialidade').value = d.especialidade || '';
                document.getElementById('biografia').value = d.biografia || '';
                document.getElementById('localizacao').value = d.localizacao || '';
                document.getElementById('data_emissao').value = d.data_emissao || '';
                if (d.url_documento) {
                    document.getElementById('container-cert-atual').style.display = 'block';
                    const nomeBase = d.url_documento.split('/').pop();
                    document.getElementById('nome-arquivo-atual').textContent = nomeBase;
                }

                document.getElementById('btn-remover-cert').addEventListener('click', () => {
                    if(confirm("Deseja remover o documento de registro atual?")) {
                        document.getElementById('container-cert-atual').style.display = 'none';
                        document.getElementById('manter_certificado').value = "0";
                    }
                });

                // RENDERIZA A LISTA DE CERTIFICADOS ATUAIS (NOVO)
                const listaContainer = document.getElementById('lista-certificados-atuais');
                if (d.certificados && d.certificados.length > 0) {
                    let htmlCerts = '<p style="font-weight: bold; margin-bottom: 10px; color: #333;">Certificados já publicados:</p>';
                    d.certificados.forEach(c => {
                        htmlCerts += `
                            <div id="cert-box-${c.id_certificado}" style="display: flex; justify-content: space-between; align-items: center; background: #fdfdfd; padding: 12px; margin-bottom: 10px; border: 1px solid #e2e8f0; border-radius: 6px;">
                                <div>
                                    <span style="font-weight: bold; color: #004085;">✔ ${c.titulo}</span><br>
                                    <small style="color: #666;">Arquivo: ${c.nome_arquivo}</small>
                                </div>
                                <button type="button" onclick="removerCertificado(${c.id_certificado})" style="background-color: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">Excluir</button>
                            </div>
                        `;
                    });
                    listaContainer.innerHTML = htmlCerts;
                } else {
                    listaContainer.innerHTML = '<p style="color: #666; font-style: italic; margin-bottom: 15px;">Nenhum certificado publicado ainda.</p>';
                }
            }
        }
    });

    const form = document.getElementById('form-editar');
    form.addEventListener('submit', function(e) {
        e.preventDefault(); 
        const formData = new FormData(this);

        fetch('editarperfil.php', { 
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Alterações salvas com sucesso!');
                window.location.href = '../index.html'; 
            } else {
                alert('Erro: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Erro:', error);
            alert('Ocorreu um erro técnico ao salvar.');
        });
    });
});

function validarCamposCertificado() {
    const arquivo = document.getElementById('url_documento_cert');
    const titulo = document.getElementById('titulo_certificado');
    const dataEmissao = document.getElementById('data_emissao_cert');
                
    const labelArquivo = document.getElementById('label_arquivo_certificado');
    const labelTitulo = document.getElementById('label_titulo_certificado');
    const labelData = document.getElementById('label_data_emissao');

    const temArquivo = arquivo.files.length > 0;
    const temTitulo = titulo.value.trim() !== '';
    const temData = dataEmissao.value !== '';

    if (temArquivo || temTitulo || temData) {
        arquivo.required = true;
        titulo.required = true;
        dataEmissao.required = true;
                    
        labelArquivo.innerHTML = 'Arquivo do Certificado (PDF) <span style="color: red;">*</span>';
        labelTitulo.innerHTML = 'Título da Especialização <span style="color: red;">*</span>';
        labelData.innerHTML = 'Data de Emissão <span style="color: red;">*</span>';
    } else {
        arquivo.required = false;
        titulo.required = false;
        dataEmissao.required = false;
                    
        labelArquivo.innerHTML = 'Arquivo do Certificado (PDF)';
        labelTitulo.innerHTML = 'Título da Especialização';
        labelData.innerHTML = 'Data de Emissão';
    }
}

function removerCertificado(idCertificado) {
    if (confirm("Tem certeza que deseja excluir este certificado permanentemente? Esta ação não pode ser desfeita.")) {
        const formData = new FormData();
        formData.append('id_certificado', idCertificado);

        fetch('remover_certificado.php', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
                // Remove o bloquinho da tela imediatamente sem precisar recarregar a página
                const box = document.getElementById(`cert-box-${idCertificado}`);
                if (box) box.remove();
            } else {
                alert('Erro: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Erro:', error);
            alert('Erro técnico ao tentar remover o certificado.');
        });
    }
}
</script>
</body>
</html>
