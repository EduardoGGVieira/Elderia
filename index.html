<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderia - Busca de Profissionais</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header class="cabecalho-principal">
        <div class="logo-container">
            <a href="index.html">
                <h1>ELDERIA</h1>
                <img src="https://media.tenor.com/wGufiBV_pI0AAAAe/hide-the-pain-harold-pain.png" alt="Início" class="haroldo">
            </a>
        </div>
        <nav class="navegacao-botoes">
            <a href="perfil/" class="btn-nav">Meu Perfil</a>
            <a href="consulta/index.html" class="btn-nav">Consultas</a>
        </nav>
        <div class="usuario-info" id="area-usuario">
            <a href="conta/cadastro/cadastro.html" class="btn-nav" style="background-color: var(--cor-secundaria); padding: 5px 15px; border-radius: 20px; text-decoration: none;">Criar Conta</a>
            <a href="conta/login/login.html" class="btn-sair">Login</a>
        </div>
    </header>

    <section class="boas-vindas conteiner-busca" style="text-align: center; background-color: var(--cor-card); border-radius: 12px; border: 2px solid var(--cor-primaria); padding: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <div class="banner-informativo">
            <h1 style="color: var(--cor-primaria); font-size: 2.5rem; margin-bottom: 15px;">Cuidado e Saúde</h1>
            <p style="font-size: 1.2rem; margin-bottom: 30px;">Encontre especialistas qualificados com segurança e rapidez.</p>
            
            <a href="pesquisa/pesquisa.html" class="btn-pesquisar" style="text-decoration: none; display: inline-block;">Buscar Profissionais</a>
        </div>
    </section>

    <main class="aba-profissionais conteiner-resultados">
        <div class="secao-titulo" style="text-align: center; margin-bottom: 40px;">
            <h2>Especialistas Disponíveis</h2>
            <div class="linha-decorativa" style="height: 3px; width: 100px; background-color: var(--cor-secundaria); margin: 0 auto;"></div>
        </div>

        <div id="container-cards-profissionais" class="grid-profissionais" style="display: flex; flex-direction: column; gap: 20px;">
            </div>
    </main>

    <script src="index.js"></script>
</body>

</html>
