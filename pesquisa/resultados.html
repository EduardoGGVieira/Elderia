<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderia - Resultados da Busca</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="cabecalho-principal">
        <div class="logo-container">
            <h1>ELDERIA</h1>
            <a href="../index.html">
                <img src="https://media.tenor.com/wGufiBV_pI0AAAAe/hide-the-pain-harold-pain.png" alt="Início" class="haroldo">
            </a>
        </div>
        <nav class="navegacao-botoes">
            <a href="../perfil/index.html" class="btn-nav">Ver Meu Perfil</a>
            <a href="#" class="btn-nav">Minhas Consultas</a>
        </nav>
        <div class="usuario-info" id="area-usuario">
            <a href="../conta/login/login.html" class="btn-sair">Login</a>
        </div>
    </header>

    <main class="conteiner-resultados">
        <h2 id="titulo-busca">Carregando resultados...</h2>
        <div id="lista-profissionais"></div>
    </main>

    <script>
        fetch('../conta/login/get_session.php')
            .then(res => res.json())
            .then(dados => {
                const area = document.getElementById('area-usuario');
                if (dados.logged_in) {
                    area.innerHTML = `
                        <span style="margin-right: 15px;">Olá, <strong>${dados.nome}</strong></span>
                        <a href="../conta/login/logout.php" class="btn-sair">Sair</a>
                    `;
                }
            })
            .catch(e => console.error(e));

        const parametrosUrl = new URLSearchParams(window.location.search);
        const especialidadeBusca = parametrosUrl.get('especialidade') || '';
        const localizacaoBusca = parametrosUrl.get('localizacao') || '';

        document.getElementById('titulo-busca').innerText = `Resultados para: "${especialidadeBusca}"`;

        fetch(`pesquisa.php?especialidade=${especialidadeBusca}&localizacao=${localizacaoBusca}`)
            .then(resposta => resposta.json())
            .then(profissionais => {
                const container = document.getElementById('lista-profissionais');
                
                if (profissionais.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 50px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                            <h3 style="color: #00a6ce;">Nenhum profissional encontrado.</h3>
                            <p>Tente buscar por outra especialidade ou termo.</p>
                            <br>
                            <a href="pesquisa.html" style="color: #00a6ce; font-weight: bold;">Fazer nova busca</a>
                        </div>
                    `;
                    return;
                }

                const fotoPlaceholder = "https://media.tenor.com/wGufiBV_pI0AAAAe/hide-the-pain-harold-pain.png";

                let htmlCards = '';
                profissionais.forEach(prof => {
                    
                    let estruturaHorarios = '<p style="font-size: 0.9rem; color: #777;">Nenhum horário cadastrado</p>';
                    
                    if (prof.agenda) {
                        const agendaAgrupada = {}; 
                        const horariosArray = prof.agenda.split(',');

                        horariosArray.forEach(item => {
                            const partes = item.split(':');
                            const dia = partes[0]; 
                            const horaFormatada = `${partes[1]}:${partes[2]}`; 

                            if (!agendaAgrupada[dia]) {
                                agendaAgrupada[dia] = [];
                            }
                            agendaAgrupada[dia].push(horaFormatada);
                        });

                        estruturaHorarios = '';
                        for (const dia in agendaAgrupada) {
                            const botoesDoDia = agendaAgrupada[dia].map(hora => 
                                `<button class="btn-horario">${hora}</button>`
                            ).join('');

                            estruturaHorarios += `
                                <div class="dia-coluna" style="margin-right: 15px; text-align: center;">
                                    <strong style="display: block; margin-bottom: 8px; color: #333;">${dia}</strong>
                                    ${botoesDoDia}
                                </div>
                            `;
                        }
                    }

                    htmlCards += `
                        <div class="card-profissional">
                            <div class="info-profissional">
                                <img src="${prof.foto || fotoPlaceholder}" alt="Foto de ${prof.nome}" class="foto-perfil">
                                <div class="dados-texto">
                                    <h3>${prof.nome}</h3>
                                    <p class="especialidade">${prof.especialidade}</p>
                                    <p class="avaliacao">⭐⭐⭐⭐⭐ 5.0</p>
                                    <p class="endereco">${prof.localizacao || 'Localização não informada'}</p>                                      
                                    ${prof.biografia ? `<p style="margin-top: 10px; font-size: 0.9rem; color: #555;">"${prof.biografia}"</p>` : ''}
                                </div>
                            </div>
                            <div class="agenda-profissional">
                                <h4>Horários Disponíveis</h4>
                                <div class="tabela-horarios" style="display: flex; overflow-x: auto; padding-bottom: 10px;">
                                    ${estruturaHorarios}
                                </div>
                                <button class="btn-ver-mais">Ver Todos os Dias</button>
                                <a href="../perfil.php?id=${prof.id_profissional}" class="btn-ver-mais" style="text-decoration: none; display: inline-block; text-align: center; margin-top: 5px;">Ver Perfil</a>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = htmlCards;
            })
            .catch(erro => {
                document.getElementById('lista-profissionais').innerHTML = "<p>Ocorreu um erro ao carregar os resultados.</p>";
            });
    </script>
</body>
</html>
