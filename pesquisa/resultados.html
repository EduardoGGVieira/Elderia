<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderia - Resultados da Busca</title>
    <!-- CSS da página de pesquisa -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="cabecalho-principal">
        <div class="logo-container">
            <h1>ELDERIA</h1>
            <!-- Atalho para voltar para a página inicial -->
            <a href="../index.html">
                <img src="https://media.tenor.com/wGufiBV_pI0AAAAe/hide-the-pain-harold-pain.png" alt="Início" class="haroldo">
            </a>
        </div>
        <nav class="navegacao-botoes">
            <a href="../perfil/index.html" class="btn-nav">Ver Meu Perfil</a>
            <a href="#" class="btn-nav">Minhas Consultas</a>
        </nav>
        <!-- Área de identificação do usuário -->
        <div class="usuario-info" id="area-usuario">
            <a href="../conta/login/login.html" class="btn-sair">Login</a>
        </div>
    </header>

    <main class="conteiner-resultados">
        <h2 id="titulo-busca">Carregando resultados...</h2>

        <!-- Container onde os cards dos profissionais serão inseridos via JS -->
        <div id="lista-profissionais"></div>
    </main>

    <script>
        // --- 1. Verificação de Sessão (Cabeçalho) ---
        fetch('../conta/login/get_session.php')
            .then(res => res.json())
            .then(dados => {
                const area = document.getElementById('area-usuario');
                if (dados.logged_in) {
                    area.innerHTML = `
                        <span style="margin-right: 15px;">Olá, <strong>${dados.nome}</strong></span>
                        <a href="../conta/login/logout.php" class="btn-sair">Sair</a>
                    `;
                }
            })
            .catch(e => console.error("Erro na sessão:", e));

        // --- 2. Busca de Profissionais (Resultados) ---
        
        // Pega os parâmetros da URL (ex: ?especialidade=Geriatra)
        const parametrosUrl = new URLSearchParams(window.location.search);
        const especialidadeBusca = parametrosUrl.get('especialidade') || '';

        // Atualiza o título da página com o termo buscado
        document.getElementById('titulo-busca').innerText = `Resultados para: "${especialidadeBusca}"`;

        // Chama o PHP que busca no banco de dados
        fetch(`pesquisa.php?especialidade=${especialidadeBusca}`)
            .then(resposta => resposta.json())
            .then(profissionais => {
                const container = document.getElementById('lista-profissionais');
                
                // Se não encontrar ninguém
                if (profissionais.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 50px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                            <h3 style="color: #00a6ce;">Nenhum profissional encontrado.</h3>
                            <p>Tente buscar por outra especialidade ou termo.</p>
                            <br>
                            <a href="pesquisa.html" style="color: #00a6ce; font-weight: bold;">Fazer nova busca</a>
                        </div>
                    `;
                    return;
                }

                // Cria o HTML de cada card
                let htmlCards = '';
                profissionais.forEach(prof => {
                    htmlCards += `
                        <div class="card-profissional">
                            <div class="info-profissional">
                                <!-- Placeholder da foto (pode ser trocado por imagem real depois) -->
                                <div style="width: 100px; height: 100px; background-color: #f0f0f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #00a6ce; color: #00a6ce; font-weight: bold;">Foto</div>
                                
                                <div class="dados-texto">
                                    <h3>${prof.nome}</h3>
                                    <p class="especialidade">${prof.especialidade}</p>
                                    <p class="avaliacao">⭐⭐⭐⭐⭐ 5.0 (Novo)</p>
                                    <!-- Biografia se existir -->
                                    ${prof.biografia ? `<p style="margin-top: 10px; font-size: 0.9rem; color: #666; font-style: italic;">"${prof.biografia}"</p>` : ''}
                                </div>
                            </div>

                            <div class="agenda-profissional">
                                <h4>Próximos Horários</h4>
                                <div class="tabela-horarios">
                                    <div class="dia-coluna">
                                        <strong>Hoje</strong>
                                        <button class="btn-horario">14:00</button>
                                        <button class="btn-horario">15:30</button>
                                    </div>
                                </div>
                                <a href="../perfil.php?id=${prof.id_usuario}" class="btn-ver-mais" style="text-decoration: none; display: inline-block; text-align: center;">Ver Perfil</a>
                            </div>
                        </div>
                    `;
                });

                // Insere os cards na tela
                container.innerHTML = htmlCards;
            })
            .catch(erro => {
                console.error("Erro ao buscar dados:", erro);
                document.getElementById('lista-profissionais').innerHTML = "<p>Ocorreu um erro ao carregar os resultados.</p>";
            });
    </script>
</body>
</html>
