<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderia - Resultados da Busca</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="cabecalho-principal">
        <div class="logo-container">
            <h1>ELDERIA</h1>
            <img src="https://media.tenor.com/wGufiBV_pI0AAAAe/hide-the-pain-harold-pain.png" alt="haroldao" class="haroldo">
        </div>
        <nav class="navegacao-botoes">
            <a href="#" class="btn-nav">Ver Meu Perfil</a>
            <a href="#" class="btn-nav">Ver Minhas Consultas</a>
        </nav>
        <div class="usuario-info">
            <span>Bem-vindo, Fazuélinton da Silva</span>
            <a href="#" class="btn-sair">Sair</a>
        </div>
    </header>

    <main class="conteiner-resultados">
        <h2 id="titulo-busca">Carregando resultados...</h2>

        <div id="lista-profissionais"></div>
    </main>

    <script>
        const parametrosUrl = new URLSearchParams(window.location.search);
        const especialidadeBusca = parametrosUrl.get('especialidade') || '';

        document.getElementById('titulo-busca').innerText = `Resultados para: "${especialidadeBusca}"`;

        fetch(`pesquisa.php?especialidade=${especialidadeBusca}`)
            .then(resposta => resposta.json())
            .then(profissionais => {
                const container = document.getElementById('lista-profissionais');
                
                if (profissionais.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 50px; background: white; border-radius: 12px;">
                            <h3 style="color: #E36414;">Nenhum profissional encontrado.</h3>
                            <p>Tente buscar por outra especialidade.</p>
                        </div>
                    `;
                    return;
                }

                let htmlCards = '';
                profissionais.forEach(prof => {
                    htmlCards += `
                        <div class="card-profissional">
                            <div class="info-profissional">
                                <div style="width: 120px; height: 120px; background-color: #ccc; border-radius: 50%; display: flex; align-items: center; justify-content: center;">Foto</div>
                                
                                <div class="dados-texto">
                                    <h3>${prof.nome}</h3>
                                    <p class="especialidade">${prof.especialidade}</p>
                                    <p class="avaliacao">⭐⭐⭐⭐⭐ 5.0</p>
                                    <p class="endereco">Endereço não cadastrado</p>
                                    ${prof.biografia ? `<p style="margin-top: 10px; font-size: 0.9rem; color: #555;">"${prof.biografia}"</p>` : ''}
                                </div>
                            </div>

                            <div class="agenda-profissional">
                                <h4>Horários Disponíveis</h4>
                                <div class="tabela-horarios">
                                    <div class="dia-coluna">
                                        <strong>Hoje</strong>
                                        <button class="btn-horario">13:00</button>
                                        <button class="btn-horario">14:00</button>
                                    </div>
                                </div>
                                <button class="btn-ver-mais">Ver Mais Horários</button>
                               <a href="../index.html"> <button class="btn-ver-mais">Voltar</button> </a>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = htmlCards;
            })
            .catch(erro => {
                console.error("Erro ao buscar dados:", erro);
                document.getElementById('lista-profissionais').innerHTML = "<p>Erro ao carregar o sistema.</p>";
            });
    </script>
</body>
</html>
